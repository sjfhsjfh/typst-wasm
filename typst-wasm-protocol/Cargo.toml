[package]
name = "typst-wasm-protocol"
edition = "2021"
version.workspace = true
description = "Protocol and ergonomic argument/response wrappers for Typst WebAssembly plugins."
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["typst", "wasm", "webassembly", "plugin", "serde"]
categories = ["wasm", "development-tools", "encoding"]
exclude = ["examples/**"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["json", "cbor"]
json = ["dep:serde", "dep:serde_json", "dep:serde_path_to_error"]
cbor = ["dep:serde", "dep:ciborium"]

[dependencies]
ciborium = { version = "0.2", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
serde_path_to_error = { version = "0.1", optional = true }
typst-wasm-macros = { workspace = true }
